name: Release package acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages for the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.ref }}

jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    uses: ./.github/workflows/quality.yml
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the publication ref
        id: ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          test "$GITHUB_REF" = "refs/tags/v$(cat VERSION)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: browser-viewer/package-lock.json
      - name: Install acceptance dependencies
        run: |
          python -m pip install --require-hashes -r requirements-validator.lock
          python browser-viewer/scripts/install-ci-firefox.py "$RUNNER_TEMP/firefox-tools"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth x11-utils
          npm --prefix browser-viewer ci --ignore-scripts
          node --test browser-viewer/tests/publish-viewer-builds.test.mjs
          cd browser-viewer
          npx playwright install --with-deps chromium
          npx playwright install-deps firefox
      - name: Build candidate packages
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          mkdir "$RUNNER_TEMP/release-candidates"
          stage="$RUNNER_TEMP/release-candidates"
          mvn -B "-Deapdf.build.directory=$RUNNER_TEMP/creator" verify
          mvn -B -f validator-desktop/pom.xml "-Deapdf.build.directory=$RUNNER_TEMP/validator" verify
          cp -- "$RUNNER_TEMP/validator/eapdf-validator-$version.jar" "$stage/"
          viewer_version=$(node -p 'require("./browser-viewer/package.json").version')
          cp -- "$RUNNER_TEMP/creator/emailtopdfa-$version"{,-gui}.jar "$stage/"
          npm --prefix browser-viewer run package:beta
          cp -- browser-viewer/releases/eapdf-viewer-"$viewer_version"-{chromium,firefox}.zip "$stage/"
          EAPDF_VIEWER_DIST="$RUNNER_TEMP/desktop" bash desktop-viewer/package.sh -DskipTests
          cp -- "$RUNNER_TEMP/desktop/"*.jar "$stage/"
          mvn -B -f desktop-viewer/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.9.0:copy-dependencies \
            -DincludeGroupIds=org.openjfx -DincludeClassifiers=linux "-DoutputDirectory=$RUNNER_TEMP/javafx"
          cp docs/EA-PDF_Software_Architecture.pdf "$stage/EA-PDF_Software_Architecture-$version.pdf"
          python -B scripts/package_configuration.py "$stage/configuration-$version.zip"
          cp docs/EA-PDF_User_Manual.pdf "$stage/EA-PDF_User_Manual-$version.pdf"
          cp docs/site/privacy.md "$stage/PRIVACY-$version.md"
          zip -q -r "$stage/ea-pdf-examples-$version.zip" examples
          zip -q -r "$stage/ea-pdf-screenshots-$version.zip" docs/screenshots
          zip -q -r "$stage/licenses-and-notices-$version.zip" LICENSE NOTICE THIRD_PARTY_NOTICES.md third_party_licenses
      - name: Verify the candidate bytes
        env:
          JAVAFX_LIB: ${{ runner.temp }}/javafx
          FIREFOX_PATH: ${{ runner.temp }}/firefox-tools/firefox/firefox
          GECKODRIVER_PATH: ${{ runner.temp }}/firefox-tools/geckodriver
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="$RUNNER_TEMP/release-candidates"
          evidence="$RUNNER_TEMP/release-acceptance"
          version=$(cat VERSION)
          args=()
          for zip in "$stage"/eapdf-viewer-*.zip; do args+=(--viewer "$zip"); done
          for file in "$stage"/*; do
            case "$file" in *.jar|*/eapdf-viewer-*.zip) ;; *) args+=(--auxiliary "$file") ;; esac
          done
          args+=(--creator-gui "$stage/emailtopdfa-$version-gui.jar" --validator-gui)
          desktop=("$stage"/eapdf-desktop-viewer-*.jar)
          test "${#desktop[@]}" -eq 1
          xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' python -B scripts/check_release_packages.py \
            --creator "$stage/emailtopdfa-$version.jar" --validator "$stage/eapdf-validator-$version.jar" \
            --desktop-viewer "${desktop[0]}" --output "$evidence" "${args[@]}"
          cp -- "$evidence/SHA256SUMS" "$stage/"
          (cd "$stage" && sha256sum --strict -c SHA256SUMS)
          cp "docs/releases/$version.md" "$RUNNER_TEMP/release-notes.md"
      - name: Inventory candidate dependencies
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-candidates"
          evidence="$RUNNER_TEMP/release-acceptance"
          version=$(cat VERSION)
          inventory="$evidence/inventory"
          mkdir -p "$inventory"
          goal=org.apache.maven.plugins:maven-dependency-plugin:3.9.0:list
          flags=(-B -DincludeScope=runtime -DoutputAbsoluteArtifactFilename=true)
          mvn "${flags[@]}" "$goal" "-DoutputFile=$inventory/creator-dependencies.txt"
          mvn "${flags[@]}" -f validator-desktop/pom.xml "$goal" "-DoutputFile=$inventory/validator-dependencies.txt"
          mvn "${flags[@]}" -f desktop-viewer/pom.xml "$goal" "-DoutputFile=$inventory/desktop-dependencies.txt"
          browser=()
          for package in "$stage"/eapdf-viewer-*.zip; do browser+=(--browser-zip "$package"); done
          desktop=("$stage/"eapdf-*viewer-*.jar)
          python3 -B scripts/security_inventory.py --output "$inventory" \
            --creator-dependencies "$inventory/creator-dependencies.txt" --creator-jar "$stage/emailtopdfa-$version.jar" \
            --creator-gui-jar "$stage/emailtopdfa-$version-gui.jar" \
            --validator-dependencies "$inventory/validator-dependencies.txt" --validator-jar "$stage/eapdf-validator-$version.jar" \
            --desktop-dependencies "$inventory/desktop-dependencies.txt" --desktop-jar "${desktop[0]}" "${browser[@]}"
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - name: Gate high and critical runtime advisories
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-candidates"
          evidence="$RUNNER_TEMP/release-acceptance"
          inventory="$evidence/inventory"
          status=0
          for bom in "$inventory/"*.cdx.json; do
            "$GRYPE" "sbom:$bom" --fail-on high --output json > "${bom%.cdx.json}.grype.json" || status=1
          done
          test "$status" -eq 0
          cp -- "$inventory/"*.cdx.json "$stage/"
          (cd "$stage" && sha256sum -- *.cdx.json) >> "$stage/SHA256SUMS"
          (cd "$stage" && sha256sum --strict -c SHA256SUMS)
          cp -- "$stage/SHA256SUMS" "$evidence/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-acceptance-evidence
          path: |
            ${{ runner.temp }}/release-acceptance/**/*.log
            ${{ runner.temp }}/release-acceptance/**/*.json
            ${{ runner.temp }}/release-acceptance/SHA256SUMS
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-packages
          path: ${{ runner.temp }}/release-candidates/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: [quality, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-packages
          path: release-candidates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Publish exactly the verified packages
        working-directory: release-candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIED_COMMIT: ${{ needs.acceptance.outputs.commit }}
        run: |
          set -euo pipefail
          sha256sum --strict -c SHA256SUMS
          mapfile -t files < <(cut -c 67- SHA256SUMS)
          test "${#files[@]}" -eq "$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$VERIFIED_COMMIT"
          options=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file ../notes/release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "${options[@]}" -- "$RELEASE_TAG" SHA256SUMS "${files[@]}"
          download=$(mktemp -d "$RUNNER_TEMP/release-download.XXXXXXXX")
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$download" -- "$RELEASE_TAG"
          cmp -- SHA256SUMS "$download/SHA256SUMS"
          (cd "$download" && sha256sum --strict -c SHA256SUMS)
          test "$(find "$download" -maxdepth 1 -type f | wc -l)" -eq "$(( ${#files[@]} + 1 ))"
          gh release edit --repo "$GITHUB_REPOSITORY" --draft=false -- "$RELEASE_TAG"
