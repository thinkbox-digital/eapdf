name: Conversion quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  small-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/quality/requirements.txt
      - run: python scripts/quality_release_gate.py --output output/quality-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversion-quality-evidence
          path: output/quality-ci
          retention-days: 14
