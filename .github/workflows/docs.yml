name: Documentation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'VERSION'
      - 'browser-viewer/package.json'
      - 'README.md'
      - 'ea-pdf-examples.zip'
      - 'docs/**'
      - 'browser-viewer/docs/**'
      - 'examples/eml/eml_seating_archive_1m.pdf'
      - 'scripts/check_public_docs.py'
      - 'AGENTS.md'
      - 'config/README.md'
      - 'validator-desktop/README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'scripts/build_documentation.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: python -m pip install -r requirements-site.txt
      - name: Check documentation privacy
        run: python scripts/check_public_docs.py
      - name: Build documentation strictly
        run: python scripts/build_documentation.py --output "$RUNNER_TEMP/eapdf-site"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: desktop-viewer/pom.xml
      - name: Refresh the README Desktop Viewer screenshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          viewer=$(EAPDF_VIEWER_DIST="$RUNNER_TEMP/readme-desktop-viewer" bash desktop-viewer/package.sh -DskipTests)
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp -noreset' \
            bash scripts/manual/capture-readme.sh "$viewer" "$RUNNER_TEMP/eapdf-site/screenshots/readme-viewer-1m.png"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/eapdf-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
