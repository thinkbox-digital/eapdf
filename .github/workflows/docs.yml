name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'config/README.md'
      - 'validator-desktop/README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'scripts/build_documentation.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'config/README.md'
      - 'validator-desktop/README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'scripts/build_documentation.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: python -m pip install -r requirements-site.txt
      - name: Build documentation strictly
        run: python scripts/build_documentation.py --output "$RUNNER_TEMP/eapdf-site"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/eapdf-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
