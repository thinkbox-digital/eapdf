name: Publish patched libraries
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify existing packages without republishing
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-patched-libraries
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
      - name: Verify locked library artifacts
        run: python3 scripts/build_patched_openhtmltopdf.py
      - name: Publish binary and matching source JARs
        if: ${{ !inputs.verify_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          renderer_version=$(python3 -c 'import json; print(json.load(open("third_party/openhtmltopdf/lock.json"))["version"])')
          for artifact in openhtmltopdf-core openhtmltopdf-pdfbox; do
            base="third_party/maven/io/github/openhtmltopdf/$artifact/$renderer_version/$artifact-$renderer_version"
            mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
              -Dfile="$base.jar" -DpomFile="$base.pom" -Dsources="$base-sources.jar" \
              -DrepositoryId=github -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          done
      - name: Verify downloaded package bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_published_libraries.py
