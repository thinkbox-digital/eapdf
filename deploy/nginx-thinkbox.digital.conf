limit_req_zone $binary_remote_addr zone=eapdf_requests:10m rate=30r/m;

server {
    listen 80;
    server_name thinkbox.digital www.thinkbox.digital;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thinkbox.digital www.thinkbox.digital;
    ssl_certificate /etc/letsencrypt/live/thinkbox.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkbox.digital/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /ea-pdf-validator/ {
        limit_req zone=eapdf_requests burst=10 nodelay;
        proxy_pass http://127.0.0.1:8876/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /ea-pdf-validator;
        proxy_read_timeout 660;
        client_max_body_size 64m;
    }
}
